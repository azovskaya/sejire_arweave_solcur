name: Deploy SEJIRE to GitHub Pages

# UI hosting: GitHub Pages only (no ShipStatic / Netlify / other CDNs).
# Vault data still publishes to Arweave L1 from the browser (not this workflow).

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "presentation/**"
      - "index.html"
      - ".github/workflows/pages.yml"
      - "scripts/deploy-pages.sh"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build
        working-directory: apps/web
        env:
          VITE_PUBLISH_MODE: self
          VITE_QA_TOOLS: "0"
        run: |
          npm ci
          npm run build
      - name: Stage site
        run: |
          mkdir -p apps/web/dist/presentation
          if [ -d presentation ]; then cp -a presentation/. apps/web/dist/presentation/; fi
          if [ -f index.html ]; then cp -f index.html apps/web/dist/repo-index.html; fi
          touch apps/web/dist/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
          force_orphan: true
          enable_jekyll: false
